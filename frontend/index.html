<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Telecom AI NOC — real-time 3GPP Release 18 cell tower energy optimization dashboard with live geospatial telemetry, AI power streaming and what-if simulation."
    />
    <meta name="theme-color" content="#fafafa" />
    <title>Telecom AI NOC | 3GPP Energy Engine</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("telecom_theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
